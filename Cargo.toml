[package]
name = "castle-token"
version = "0.1.0"
edition = "2021"
description = "Generator for the X-CRS-Req-Token header minted by Castle's web SDK (build d60)."
license = "MIT"

[lib]
name = "castle_token"
path = "src/lib.rs"

[[bin]]
name = "castle-token"
path = "src/main.rs"

[dependencies]
base64 = "0.22"
clap = { version = "4", features = ["derive"] }
hex = "0.4"
murmurhash3 = "0.0.5"
rand = "0.8"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "1"

[dev-dependencies]
sha2 = "0.10"

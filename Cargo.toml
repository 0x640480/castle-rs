[package]
name = "castle-token"
version = "0.1.0"
edition = "2021"
description = "Generator for the X-Castle-Request-Token header minted by Castle's web SDK."
license = "MIT"

# The Python binding (PyO3) lives in `python/` as a workspace member. Bare cargo
# commands default to the core crate so the Rust toolchain never has to build
# the cdylib (which needs a Python interpreter) — see default-members.
[workspace]
members = ["python"]
resolver = "2"
default-members = ["."]

[lib]
name = "castle_token"
path = "src/lib.rs"

[[bin]]
name = "castle-token"
path = "src/main.rs"

[dependencies]
base64 = "0.22"
clap = { version = "4", features = ["derive"] }
hex = "0.4"
murmurhash3 = "0.0.5"
rand = "0.8"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "1"

[dev-dependencies]
sha2 = "0.10"
